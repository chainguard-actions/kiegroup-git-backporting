name: "release package"

on: 
  workflow_dispatch:
    inputs:
      options:
        description: 'Additional release-it options'     
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    name: Release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Npm config
        run: npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
      - run: npm ci
      # the version/changelog must be already updated on main branch using "npm run release:prepare"
      # or check prepare-release.yml workflow
      - name: New version release
        env:
          RELEASE_OPTIONS: ${{ github.event.inputs.options }}
        run: |
          args=()
          [ -n "$RELEASE_OPTIONS" ] && args+=("$RELEASE_OPTIONS")
          npm run release -- --ci --no-increment --no-git.commit "${args[@]}"
