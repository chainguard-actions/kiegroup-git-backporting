name: Test dry-run backport via config-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Discover a merged pull request and write config file
        id: pr
        env:
          TOKEN: ${{ github.token }}
          REPO: kiegroup/git-backporting
        run: |
          set -euo pipefail
          git --version
          AUTH=()
          if [ -n "${TOKEN:-}" ]; then AUTH=(-H "Authorization: Bearer $TOKEN"); fi
          BASE="$(curl -fsSL "${AUTH[@]}" "https://api.github.com/repos/$REPO" | jq -r '.default_branch')"
          echo "default branch: $BASE"
          curl -fsSL "${AUTH[@]}" \
            "https://api.github.com/repos/$REPO/pulls?state=closed&base=$BASE&sort=updated&direction=desc&per_page=50" > /tmp/prs.json
          URL="$(jq -r '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .html_url' /tmp/prs.json)"
          echo "selected PR: $URL"
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "FAIL: could not find a merged pull request"
            exit 1
          fi
          FOLDER="/tmp/bp-config-test-$$"
          rm -rf "$FOLDER"
          CFG="/tmp/bp-config-$$.json"
          jq -n --arg pr "$URL" --arg tb "$BASE" --arg folder "$FOLDER" --arg auth "${TOKEN:-}" \
            '{pullRequest: $pr, targetBranch: $tb, folder: $folder, dryRun: true}
             + (if $auth != "" then {auth: $auth} else {} end)' > "$CFG"
          jq 'del(.auth)' "$CFG"
          echo "config=$CFG" >> "$GITHUB_OUTPUT"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          config-file: ${{ steps.pr.outputs.config }}
      - name: Assert dry-run backport prepared the local branch in the configured folder
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIR: ${{ steps.pr.outputs.folder }}
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ ! -d "$DIR/.git" ]; then
            echo "FAIL: repository was not cloned into configured folder $DIR"
            exit 1
          fi
          BRANCH="$(git -C "$DIR" rev-parse --abbrev-ref HEAD)"
          echo "current branch: $BRANCH"
          case "$BRANCH" in
            "bp-$BASE-"*) ;;
            *) echo "FAIL: expected auto-generated branch 'bp-$BASE-<sha>'"; exit 1 ;;
          esac
          if [ -d "$GITHUB_WORKSPACE/bp" ]; then
            echo "NOTE: default bp folder exists (possibly from another test)"
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        env:
          DIR: ${{ steps.pr.outputs.folder }}
          CFG: ${{ steps.pr.outputs.config }}
        run: rm -rf "$DIR" "$CFG"
