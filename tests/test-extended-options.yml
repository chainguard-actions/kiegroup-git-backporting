name: Test extended options in dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          pull-request: "https://github.com/kiegroup/git-backporting/pull/1"
          target-branch: "main"
          target-branch-pattern: "^backport (?<target>([^ ]+))$"
          dry-run: "true"
          auth: "dummy-token-for-dry-run"
          git-client: "github"
          git-user: "Backport Bot"
          git-email: "backport@example.com"
          bp-branch-name: "backport/main/pr-1"
          reviewers: "user1,user2"
          assignees: "user3,user4"
          no-squash: "false"
          auto-no-squash: "false"
          cherry-pick-options: "-x"
          comments: "This is an automated backport;Please review carefully"
        continue-on-error: true

      - name: Assert action was invoked with extended options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should be invoked (not a setup/config error).
          # It may fail at the API call with a dummy token, but it should run.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with extended options"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
