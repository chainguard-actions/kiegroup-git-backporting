name: Test advanced backport options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with advanced options (expect failure due to invalid PR URL/auth)
        id: action
        uses: .
        with:
          pull-request: "https://github.com/kiegroup/git-backporting/pull/1"
          target-branch-pattern: "^backport (?<target>([^ ]+))$"
          dry-run: "true"
          auth: "fake-token-for-advanced-test"
          git-client: "github"
          auto-no-squash: "true"
          cherry-pick-options: "-x"
          strategy: "recursive"
          strategy-option: "theirs"
        continue-on-error: true

      - name: Assert action ran (outcome is either success or failure, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
