name: Test no-squash, bp-branch-name, and cherry-pick-options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          pull-request: "https://github.com/kiegroup/git-backporting/pull/1"
          target-branch: "stable"
          dry-run: "true"
          no-squash: "true"
          bp-branch-name: "backport/stable/pr-1"
          cherry-pick-options: "-x"
      - name: Assert action ran with no-squash and bp-branch-name inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted inputs and ran"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
