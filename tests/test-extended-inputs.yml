name: Test extended input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify action files exist
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/dist/gha/index.js" ]; then
            echo "FAIL: dist/gha/index.js not found"
            exit 1
          fi
          echo "PASS: action files present"

      - id: backport
        uses: .
        continue-on-error: true
        with:
          pull-request: "https://github.com/kiegroup/git-backporting/pull/1"
          target-branch: "main"
          target-branch-pattern: "^backport (?<target>([^ ]+))$"
          dry-run: "true"
          auth: "fake-token-for-dry-run"
          git-client: "github"
          git-user: "TestUser"
          git-email: "test@example.com"
          title: "Backport: my feature"
          body-prefix: "Backport of: "
          body: "This is a backported pull request."
          bp-branch-name: "backport/main/pr-1"
          reviewers: "user1,user2"
          assignees: "user3"
          no-inherit-reviewers: "true"
          labels: "backport,automated"
          inherit-labels: "false"
          no-squash: "true"
          auto-no-squash: "false"
          strategy: "recursive"
          strategy-option: "theirs"
          cherry-pick-options: "-x"
          comments: "Backported automatically;Please review"
          enable-err-notification: "false"

      - name: Assert action ran with extended inputs
        run: |
          echo "Action outcome: ${{ steps.backport.outcome }}"
          # The action will attempt to fetch PR info and may fail due to fake auth.
          # We accept either success or failure, but not skipped.
          if [ "${{ steps.backport.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action executed with extended inputs (outcome: ${{ steps.backport.outcome }})"
