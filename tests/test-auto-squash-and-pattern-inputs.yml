name: Test auto-no-squash and target-branch-pattern inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          pull-request: "https://github.com/kiegroup/git-backporting/pull/1"
          dry-run: "true"
          auto-no-squash: "true"
          target-branch-pattern: "^backport (?<target>([^ ]+))$"
      - name: Assert action ran with auto-no-squash and target-branch-pattern inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted inputs and ran"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
