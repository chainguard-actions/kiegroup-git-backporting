name: Test dry-run basic backport
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify action files exist
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/dist/gha/index.js" ]; then
            echo "FAIL: dist/gha/index.js not found"
            exit 1
          fi
          echo "PASS: action files present"

      - id: backport
        uses: .
        continue-on-error: true
        with:
          pull-request: "https://github.com/kiegroup/git-backporting/pull/1"
          target-branch: "main"
          dry-run: "true"
          git-user: "TestUser"
          git-email: "test@example.com"
          auth: "fake-token-for-dry-run"

      - name: Assert action ran (dry-run may fail on API but should not be skipped)
        run: |
          echo "Action outcome: ${{ steps.backport.outcome }}"
          # In dry-run mode with a fake token, the action will attempt to fetch PR info
          # and may fail due to auth. We accept either success or failure from the action itself,
          # but the runner should not have skipped the step.
          if [ "${{ steps.backport.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action executed (outcome: ${{ steps.backport.outcome }})"
