name: Test dry-run basic backport
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run backport in dry-run mode
        id: action
        uses: .
        with:
          pull-request: "https://github.com/kiegroup/git-backporting/pull/1"
          target-branch: "main"
          dry-run: "true"
          auth: ${{ github.token }}
          git-user: "TestUser"
          git-email: "test@example.com"
        continue-on-error: true

      - name: Assert action completed (dry-run should not fail due to push)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # In dry-run mode the action should either succeed or fail gracefully
          # (it may fail if the PR doesn't exist or branch doesn't exist, but it should not crash)
          # We just verify the step ran and produced an outcome
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran and produced outcome: ${{ steps.action.outcome }}"
