name: Test target-branch-pattern input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run backport action with target-branch-pattern but no matching labels
        id: action
        uses: .
        with:
          pull-request: "https://github.com/kiegroup/git-backporting/pull/1"
          target-branch-pattern: "^backport (?<target>([^ ]+))$"
          dry-run: "true"
          git-user: "Test User"
          git-email: "test@example.com"
        continue-on-error: true

      - name: Assert action ran with target-branch-pattern
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # When target-branch-pattern is used but no labels match, the action should
          # either fail (no target branches found) or succeed with no backports.
          # Either way, the action should have run (outcome is set).
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action did not run at all"
            exit 1
          fi
          echo "PASS: action ran with target-branch-pattern, outcome=${{ steps.action.outcome }}"
