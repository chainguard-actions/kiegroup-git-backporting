name: Test target-branch-pattern input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with target-branch-pattern
        id: action
        continue-on-error: true
        uses: .
        with:
          pull-request: "https://github.com/kiegroup/git-backporting/pull/1"
          # Pattern to extract target branch from labels like "backport main"
          target-branch-pattern: "^backport (?<target>([^ ]+))$"
          dry-run: "true"
          git-user: "Test User"
          git-email: "test@example.com"

      - name: Assert action ran with target-branch-pattern (not cancelled)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail gracefully (e.g., no matching labels),
          # but must NOT be cancelled or crash due to pattern parsing issues.
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with target-branch-pattern (outcome=${{ steps.action.outcome }})"
