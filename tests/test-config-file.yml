name: Test config-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create backport config file
        run: |
          mkdir -p /tmp/bp-config
          cat > /tmp/bp-config/backport.json <<'EOF'
          {
            "pullRequest": "https://github.com/kiegroup/git-backporting/pull/1",
            "targetBranch": "main",
            "dryRun": true,
            "gitUser": "Test User",
            "gitEmail": "test@example.com"
          }
          EOF
          echo "Config file created:"
          cat /tmp/bp-config/backport.json

      - name: Run backport action with config file
        id: action
        uses: .
        with:
          config-file: "/tmp/bp-config/backport.json"
          dry-run: "true"
        continue-on-error: true

      - name: Assert action ran with config file
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should run (not crash on startup) when given a valid config file.
          # It may fail due to remote repo state but should not fail due to config parsing.
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action did not run at all"
            exit 1
          fi
          echo "PASS: action ran with config-file, outcome=${{ steps.action.outcome }}"
