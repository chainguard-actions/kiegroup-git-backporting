name: Test squash and cherry-pick options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run backport with auto-no-squash and cherry-pick-options in dry-run mode
        id: action
        continue-on-error: true
        uses: .
        with:
          pull-request: "https://github.com/kiegroup/git-backporting/pull/1"
          target-branch: "main"
          dry-run: "true"
          git-user: "Test User"
          git-email: "test@example.com"
          auto-no-squash: "true"
          cherry-pick-options: "-x"

      - name: Assert action ran with squash/cherry-pick options (not cancelled)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail gracefully (e.g., API error),
          # but must NOT be cancelled or crash due to auto-no-squash or cherry-pick-options.
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with squash/cherry-pick options (outcome=${{ steps.action.outcome }})"
