name: Test PR metadata inputs (title, body, body-prefix, reviewers, assignees, labels, comments, git-client)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          pull-request: "https://github.com/kiegroup/git-backporting/pull/1"
          target-branch: "main"
          dry-run: "true"
          git-client: "github"
          title: "Backport: my feature"
          body-prefix: "Backport of PR #1"
          body: "This is the backported PR body."
          reviewers: "user1,user2"
          assignees: "user3"
          labels: "backport,automated"
          comments: "This was automatically backported.;Please review carefully."
      - name: Assert action ran (dry-run with fake PR may error, but inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because the PR doesn't exist or auth fails,
          # but we only need to confirm the inputs were passed (not rejected at parse time).
          # Any outcome other than a workflow syntax error is acceptable here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted inputs and ran"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
