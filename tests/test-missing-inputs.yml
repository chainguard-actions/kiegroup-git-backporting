name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without pull-request or target-branch
        id: action
        continue-on-error: true
        uses: .
        with:
          dry-run: "true"
          # Intentionally omitting pull-request and target-branch

      - name: Assert action failed due to missing inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when pull-request and target-branch are missing, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with missing required inputs"
