name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          dry-run: "true"
        # No pull-request, no target-branch, no config-file provided
        continue-on-error: true

      - name: Assert action fails when required inputs are missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # Without pull-request or config-file, the action should fail
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when required inputs were missing"
          else
            echo "FAIL: expected action to fail but got '$OUTCOME'"
            exit 1
          fi
