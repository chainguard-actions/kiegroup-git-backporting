name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without required inputs (expect failure)
        id: action
        uses: .
        with:
          dry-run: "true"
          auth: "fake-token-for-testing"
        continue-on-error: true

      - name: Assert action failed due to missing inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required inputs are missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing required inputs"
